[package]
name = "testing"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

# This is needed for the build script, 'build.rs'
[build-dependencies.skeptic]
path = "../skeptic"

# This is needed for the tests created by the buildscript
[dev-dependencies.skeptic]
path = "../skeptic"

# This makes the tests that link to Skeptic in README.md work.
# It is not needed for normal uses of Skeptic.
[dependencies.skeptic]
path = "../skeptic"

[dependencies.derive_more]
version = "0.99"
default-features = false
features = ["from"]

# Dependencies for testing multiple rand versions scenario
[dependencies]
rand = "0.8"
oorandom = "11"

# Criterion has Windows linking issues in CI, so make it conditional
[target.'cfg(not(windows))'.dependencies]
criterion = "0.6"

[target.'cfg(windows)'.dependencies]
criterion = { version = "0.6", optional = true }

