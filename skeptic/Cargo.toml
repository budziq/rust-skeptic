[package]
description = "Test your Rust markdown documentation via Cargo"
license = "MIT OR Apache-2.0"
name = "skeptic"
version = "0.14.0"
readme = "../README.md"
repository = "https://github.com/budziq/rust-skeptic"
homepage = "https://github.com/budziq/rust-skeptic"
documentation = "https://docs.rs/skeptic"
keywords = ["markdown", "documentation", "testing"]
categories = ["development-tools", "development-tools::testing"]
edition = "2021"
rust-version = "1.56"

[dependencies]
bytecount = "0.6"
cargo_metadata = "0.15"
glob = "0.3"
pulldown-cmark = { version = "0.9", default-features = false }
tempfile = "3"
walkdir = "2.2"
thiserror = "1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[dev-dependencies]
unindent = "0.2"
tempfile = "3"
